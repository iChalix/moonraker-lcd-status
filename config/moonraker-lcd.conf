# Moonraker LCD Status - Konfiguration
#
# Kommentare beginnen mit "#". Nach Aenderungen den Dienst neu starten:
#   sudo systemctl restart moonraker-lcd

[moonraker]
# Adresse von Moonraker; der Dienst darf auch auf einem anderen Rechner laufen
url = ws://127.0.0.1:7125/websocket
# Nur noetig, wenn Moonraker diesen Rechner nicht als vertrauenswuerdig kennt
#api_key =
#api_key_file = ~/.moonraker_api_key

[serial]
# Port des Display-Arduino. Anzeigen mit:  ls -l /dev/serial/by-id/ /dev/serial/by-path/
# CH340-Nachbauten haben keine Seriennummer: Stecken zwei davon am selben
# Rechner, fuer beide den Pfad unter /dev/serial/by-path/ eintragen.
port =

[display]
# de oder en
language = de
# a00 = uebliche Displays, a02 = europaeischer Zeichensatz, ascii = ohne Umlaute
charset = a00
# Name im Leerlauf; leer = Hostname
name =
# Seiten in dieser Reihenfolge: status, temperatures, print, system
pages = status, temperatures, print, system
# Seiten automatisch wechseln, alle ... Sekunden (0 = aus)
auto_rotate = 0
# nach ... Sekunden ohne Eingabe zurueck zur ersten Seite (0 = aus)
page_timeout = 60
# Beleuchtung nach ... Minuten Leerlauf aus (0 = immer an)
backlight_timeout = 0
# LCD alle ... Sekunden neu initialisieren, faengt Stoerungen ab (0 = aus)
reinit_interval = 300
clock_12h = no
# nicht anzeigen, durch Komma getrennt, z. B.: temperature_sensor mcu_temp
hide =

[encoder]
enabled = yes
# yes, wenn die Drehrichtung verkehrt ist
reverse = no

[progress]
# auto = Position in der Datei ohne Kopf-/Fussdaten, display = M73, sdcard = Dateiposition
source = auto
# auto = Mischung aus Slicer-Schaetzung und bisheriger Geschwindigkeit, slicer, file
eta = auto

[menu]
enabled = yes
# Menue schliesst sich nach ... Sekunden ohne Eingabe
timeout = 20
pause = yes
cancel = yes
# erscheint nur, wenn Klipper gestoppt hat
firmware_restart = yes
# Rechner neu starten / herunterfahren (mit Rueckfrage, nie waehrend eines Drucks)
reboot = no
shutdown = no

# Eigene Menuepunkte: entweder gcode (auch mehrzeilig) oder power_device
# (Moonraker-Geraet, wird umgeschaltet).
#   when    = idle (Standard), printing, paused, active (Druck oder Pause), always
#   confirm = yes  fragt vorher nach
#
#[menu_item Vorheizen PLA]
#gcode =
#  M140 S60
#  M104 S200
#
#[menu_item Homing]
#gcode = G28
#confirm = yes
#
#[menu_item Licht]
#power_device = licht
#when = always

# Anzeigenamen fuer Klipper-Objekte
#[names]
#extruder = Duese
#heater_generic chamber = Bauraum
#temperature_sensor raspberry_pi = Pi

[logging]
level = info
